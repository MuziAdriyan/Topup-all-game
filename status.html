<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Pesanan — GDevShop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h4M8 10v4M15 13h.01M18 11h.01M8 6h8a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-4a4 4 0 0 1 4-4Z"/></svg></span>
      <span class="brand-name">GDev<span>Shop</span></span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#promo">Promo</a>
      <a href="index.html#layanan">Layanan</a>
      <a href="status.html" class="active">Cek Pesanan</a>
    </nav>
  </div>
</header>

<section class="section" style="max-width:640px; margin:0 auto;">
  <div class="container" style="padding:0;">
    <div class="section-head" style="margin-bottom:20px;">
      <div>
        <span class="section-tag">Lacak Transaksi</span>
        <h2>Cek Status Pesanan</h2>
      </div>
    </div>

    <form class="panel form-panel" id="trackForm" style="padding:22px; margin-bottom:24px;">
      <div class="field" style="margin-bottom:0;">
        <label for="orderIdInput">ID Pesanan</label>
        <input type="text" id="orderIdInput" placeholder="Contoh: GDS-20260828-0001" required>
        <span class="hint">ID pesanan dikirim melalui email/WhatsApp setelah checkout.</span>
      </div>
      <button type="submit" class="btn btn-primary btn-block">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        Lacak Pesanan
      </button>
    </form>

    <div class="panel status-panel" id="resultPanel" style="display:none;">
      <span class="badge" id="resultBadge">—</span>
      <h3 style="font-family:var(--font-display); margin:14px 0 4px;" id="resultOrderId">—</h3>
      <p style="color:var(--text-muted); font-size:13.5px; margin:0 0 6px;" id="resultDetail">—</p>

      <div class="status-timeline" id="statusTimeline">
        <!-- populated by script.js -->
      </div>
    </div>

    <div class="panel status-panel" id="emptyPanel" style="display:none; text-align:center;">
      <p style="color:var(--text-muted); font-size:14px; margin:0;">Pesanan tidak ditemukan. Periksa kembali ID pesanan Anda.</p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-bottom"><span>© 2026 GDevShop. Seluruh hak cipta dilindungi.</span></div>
</footer>

<script src="script.js"></script>
</body>
</html>
